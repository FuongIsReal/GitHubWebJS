<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính tiền bán hàng</title>
    <link rel="stylesheet" href="tinhtien.css">
</head>
<body>
    <h2>Tính tiền bán hàng</h2>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên hàng hóa</th>
                <th>Số lượng có</th>
                <th>Số lượng mua</th>
                <th>Đơn giá</th>
                <th class="khong-in">Chọn mua</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>CPU</td>
                <td>14</td>
                <td><input type="number" id="mua1" min="1" disabled></td>
                <td>120 $</td>
                <td class="khong-in"><input type="checkbox" id="chon1" onchange="batTatO(1)"></td>
            </tr>
            <tr>
                <td>2</td>
                <td>HDD</td>
                <td>14</td>
                <td><input type="number" id="mua2" min="1" disabled></td>
                <td>10 $</td>
                <td class="khong-in"><input type="checkbox" id="chon2" onchange="batTatO(2)"></td>
            </tr>
            <tr>
                <td>3</td>
                <td>RAM</td>
                <td>12</td>
                <td><input type="number" id="mua3" min="1" disabled></td>
                <td>29 $</td>
                <td class="khong-in"><input type="checkbox" id="chon3" onchange="batTatO(3)"></td>
            </tr>
            <tr>
                <td>4</td>
                <td>ROM</td>
                <td>23</td>
                <td><input type="number" id="mua4" min="1" disabled></td>
                <td>130 $</td>
                <td class="khong-in"><input type="checkbox" id="chon4" onchange="batTatO(4)"></td>
            </tr>
        </tbody>
    </table>

    <div class="tong">
        <p>Tổng cộng: <input type="text" id="tongcong" value="0" readonly> $</p>
        <p class="khong-in">
            <label><input type="checkbox" id="vat"> VAT (cộng thêm 10%)</label>
        </p>
    </div>

    <div class="nut khong-in">
        <button onclick="tinhTien()">OK</button>
        <button onclick="nhapLai()">Nhập lại</button>
        <button onclick="window.print()">In</button>
    </div>

    <script src="tinhtien.js"></script>
</body>
</html>
